<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>≪カウンセリングシート≫</title>

  <style>
    :root{
      --bg:#f2f2f2;
      --line:#e6e6e6;
      --text:#222;
      --muted:#777;
      --card:#fff;
      --dark:#222;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    }
    .titlebar{
      background:#efefef;
      border-bottom:1px solid var(--line);
      padding:12px 14px;
      text-align:center;
      font-weight:800;
      letter-spacing:.02em;
      position:sticky;
      top:0;
      z-index:10;
    }
    .sheet{
      max-width:720px;
      margin:0 auto;
      background:var(--card);
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
    }
    .row{
      display:flex;
      gap:12px;
      padding:14px;
      border-top:1px solid var(--line);
      align-items:flex-start;
    }
    .row:first-child{ border-top:0; }

    .label{
      width:180px;
      min-width:180px;
      font-weight:800;
      padding-top:10px;
      line-height:1.2;
    }
    .label .req{ margin-left:4px; font-weight:900; }
    .control{ flex:1; }
    .hint{
      font-size:12px;
      color:var(--muted);
      margin:0 0 6px;
      line-height:1.4;
    }

    input[type="text"], input[type="tel"]{
      width:100%;
      height:44px;
      padding:10px 12px;
      border:1px solid #d6d6d6;
      border-radius:12px;
      font-size:16px;
      background:#fff;
      outline:none;
    }
    input[type="text"]:focus, input[type="tel"]:focus{
      border-color:#111;
      box-shadow:0 0 0 3px rgba(0,0,0,.06);
    }

    .chkGrid{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:6px;
    }
    .chk{
      width:100%;
      display:flex;
      align-items:flex-start;
      gap:10px;
      padding:12px 12px;
      border:1px solid #d6d6d6;
      border-radius:12px;
      background:#fff;
      font-weight:800;
      user-select:none;
      line-height:1.6;
    }
    .chk input{
      margin-top:2px;
      width:20px;
      height:20px;
      accent-color:#111;
      flex:0 0 auto;
    }

    .actionsRow{
      padding:18px 14px 22px;
      border-top:1px solid var(--line);
      background:#fff;
      position:sticky;
      bottom:0;
      z-index:5;
      padding-bottom:calc(22px + env(safe-area-inset-bottom));
    }
    .twoBtns{ display:flex; gap:12px; }
    .pillConfirm{
      flex:1;
      height:52px;
      border-radius:999px;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      border:2px solid #111;
      background:#fff;
      color:#111;
    }

    .confirm{ display:none; padding:14px; }
    .confirm h2{ margin:8px 0 12px; font-size:18px; }
    .summary{
      border:1px solid var(--line);
      border-radius:12px;
      overflow:hidden;
      background:#fff;
    }
    .sumRow{
      display:flex;
      gap:12px;
      padding:12px 14px;
      border-top:1px solid var(--line);
    }
    .sumRow:first-child{ border-top:0; }
    .sumKey{
      width:200px;
      min-width:200px;
      color:#111;
      font-weight:900;
    }
    .sumVal{
      flex:1;
      color:#222;
      word-break:break-word;
      white-space:pre-wrap;
    }
    .confirmActions{
      display:flex;
      gap:12px;
      margin-top:14px;
    }
    .ghost{
      flex:1;
      height:52px;
      border-radius:999px;
      border:2px solid #666;
      background:#fff;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      color:#111;
    }
    .send{
      flex:1;
      height:52px;
      border-radius:999px;
      border:0;
      background:var(--dark);
      color:#fff;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }

    html{ -webkit-text-size-adjust:100%; }
    .sheet{ max-width:640px; width:100%; }
    .row{
      display:grid;
      grid-template-columns:140px 1fr;
      align-items:center;
      gap:10px;
    }
    .label{ width:auto; min-width:0; padding-top:0; font-size:15px; }
    @media (max-width:380px){
      .row{ grid-template-columns:1fr; align-items:start; }
      .label{ padding-top:0; }
      .sumKey{ width:140px; min-width:140px; }
    }

    .dividerNote{
      padding:12px 14px 0;
      color:#111;
      font-weight:900;
    }
  </style>
</head>

<body>
  <div class="titlebar">≪カウンセリングシート≫</div>

  <main class="sheet" id="inputView">
    <form id="surveyForm" novalidate>

      <div class="row">
        <div class="label">お名前<span class="req">*</span></div>
        <div class="control">
          <p class="hint">フルネームでご入力ください。</p>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>
      </div>

      <div class="row">
        <div class="label">電話番号<span class="req">*</span></div>
        <div class="control">
          <p class="hint">ハイフンなしでもOK（例：09012345678）。</p>
          <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" required />
        </div>
      </div>

      <div class="dividerNote">注意事項（全てチェック必須）</div>

      <div class="row" id="noticeBlock">
        <div class="label">確認事項<span class="req">*</span></div>
        <div class="control">
          <p class="hint">✅が付いている項目は全てチェックしてください（未チェックがあると送信できません）。</p>
          <div class="chkGrid" id="noticeChecks">
            <label class="chk">
              <input type="checkbox" name="ack" value="肌が乾燥していると脱毛効果が低下するため、お風呂上がりや洗顔後は化粧水＋クリームでしっかり保湿する" />
              【① 保湿について】<br>
              肌が乾燥していると、脱毛効果が大きく低下します。<br>
              お風呂上がりや洗顔後は、化粧水＋クリームでしっかり保湿をお願いいたします。
            </label>

            <label class="chk">
              <input type="checkbox" name="ack" value="脱毛箇所は前日までにしっかりシェービングし、剃り残しが多い場合は別途シェービング料金がかかる場合があることを了承した" />
              【② シェービングについて】<br>
              脱毛箇所は前日までに、しっかりシェービングをお願いいたします。<br>
              剃り残しがないようご注意ください。<br><br>
              ※剃り残しが多い場合は、別途シェービング料金を頂戴する場合がございます。
            </label>

            <label class="chk">
              <input type="checkbox" name="ack" value="脱毛当日は運動・飲酒・湯船に浸かる行為を控える" />
              【③ 当日の注意事項】<br>
              脱毛当日は、以下の行為はお控えください。<br>
              ・運動<br>
              ・飲酒<br>
              ・湯船に浸かる
            </label>

            <label class="chk">
              <input type="checkbox" name="ack" value="脱毛期間中は日焼けNGのため、日焼け止めの使用など十分に対策する" />
              【④ 日焼けについて】<br>
              脱毛期間中は日焼けNGとなります。<br>
              日焼け止めの使用など、しっかり対策をお願いいたします。
            </label>

            <label class="chk">
              <input type="checkbox" name="ack" value="皮膚疾患や通院中のケガ・病気、持病がある場合は事前申告し、状態によっては施術できない場合があることを了承した" />
              【⑤ お身体の状態について】<br>
              皮膚疾患や通院中のケガ・ご病気、持病がある場合は、事前にお知らせください。<br>
              状態によっては施術ができない場合がございます。
            </label>
          </div>
        </div>
      </div>

      <div class="actionsRow">
        <div class="twoBtns">
          <button class="pillConfirm" type="button" id="toConfirm">確認</button>
        </div>
      </div>

    </form>
  </main>

  <main class="sheet confirm" id="confirmView" aria-live="polite">
    <div style="padding:14px;">
      <h2>入力内容の確認</h2>
      <div class="summary" id="summary"></div>

      <div class="confirmActions">
        <button class="ghost" type="button" id="backBtn">戻る</button>
        <button class="send" type="button" id="sendBtn">送信</button>
      </div>
    </div>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>

  <script>
    const LIFF_ID = "2009230134-u1jfH0d6";

    const el = (id) => document.getElementById(id);

    const inputView = el("inputView");
    const confirmView = el("confirmView");
    const summaryEl = el("summary");

    const toConfirm = el("toConfirm");
    const backBtn = el("backBtn");
    const sendBtn = el("sendBtn");

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function normalizePhone(raw){
      return String(raw ?? "").replace(/[^\d]/g, "");
    }

    function getAcknowledgements(){
      return Array.from(document.querySelectorAll('input[name="ack"]:checked')).map(x => x.value);
    }

    function requiredAckCount(){
      return document.querySelectorAll('input[name="ack"]').length;
    }

    function getFormData(){
      const name = el("name").value.trim();
      const phoneRaw = el("phone").value.trim();
      const phone = normalizePhone(phoneRaw);
      const acks = getAcknowledgements();
      return { name, phoneRaw, phone, acks };
    }

    function validate(){
      const d = getFormData();

      if(!d.name){
        alert("お名前を入力してください。");
        return null;
      }
      if(!d.phoneRaw){
        alert("電話番号を入力してください。");
        return null;
      }
      if(d.phone.length < 10 || d.phone.length > 11){
        alert("電話番号を正しく入力してください。（10〜11桁）");
        return null;
      }

      const need = requiredAckCount();
      const got = d.acks.length;
      if(got !== need){
        alert("注意事項の✅項目は全てチェックしてください。");
        return null;
      }

      return d;
    }

    function buildSummary(d){
      const rows = [
        ["お名前", d.name],
        ["電話番号", d.phoneRaw],
        ["確認チェック", "全てチェック済み✅\n・" + d.acks.join("\n・")],
      ];

      summaryEl.innerHTML = rows.map(([k,v]) => `
        <div class="sumRow">
          <div class="sumKey">${escapeHtml(k)}</div>
          <div class="sumVal">${escapeHtml(v)}</div>
        </div>
      `).join("");
    }

    function buildSendText(d){
      const closing =
`脱毛完了までの期間には個人差があります。
しっかり効果を出すためには、継続的な施術が必要です。

ムダ毛のない、自己処理いらずの快適な毎日を目指して
一緒に頑張っていきましょう！

当日お会いできるのを楽しみにしております😊`;

      return `≪カウンセリングシート≫
【お名前】${d.name}
【電話番号】${d.phoneRaw}

【確認チェック（全て了承）】
・${d.acks.join("\n・")}

${closing}`;
    }

    async function initLiffSafely(){
      if(!window.liff) return false;

      try{
        await liff.init({ liffId: LIFF_ID });

        if(!liff.isInClient() && !liff.isLoggedIn()){
          liff.login();
          return false;
        }

        return true;
      }catch(e){
        return false;
      }
    }

    function canSendInCurrentContext(){
      try{
        if(!window.liff) return false;
        if(!liff.isInClient()) return false;

        const context = liff.getContext?.();
        const type = context?.type || "";

        return ["utou", "room", "group"].includes(type);
      }catch(e){
        return false;
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await initLiffSafely();
    });

    toConfirm.addEventListener("click", () => {
      const d = validate();
      if(!d) return;

      buildSummary(d);

      inputView.style.display = "none";
      confirmView.style.display = "block";
      window.scrollTo({ top:0, behavior:"smooth" });
    });

    backBtn.addEventListener("click", () => {
      confirmView.style.display = "none";
      inputView.style.display = "block";
      window.scrollTo({ top:0, behavior:"smooth" });
    });

    sendBtn.addEventListener("click", async () => {
      const d = validate();
      if(!d) return;

      const text = buildSendText(d);

      try{
        const ready = await initLiffSafely();
        if(!ready){
          alert("LINEの起動確認ができませんでした。");
          return;
        }

        if(!canSendInCurrentContext()){
          alert("LINEトーク画面から開いた場合のみ送信できます。");
          return;
        }

        sendBtn.disabled = true;
        sendBtn.textContent = "送信中…";

        await liff.sendMessages([
          { type:"text", text }
        ]);

        alert("送信しました。ありがとうございました。");

        if(liff.isInClient()){
          liff.closeWindow();
        }
      }catch(e){
        alert("送信に失敗しました。もう一度お試しください。");
      }finally{
        sendBtn.disabled = false;
        sendBtn.textContent = "送信";
      }
    });
  </script>
</body>
</html>
